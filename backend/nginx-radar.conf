# Serves the dashboard on port 80 and proxies the API + WebSocket to uvicorn.
# Install:
#   sudo cp nginx-radar.conf /etc/nginx/sites-available/radar
#   sudo ln -sf /etc/nginx/sites-available/radar /etc/nginx/sites-enabled/radar
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;

    # Built dashboard (npm run build output)
    root /var/www/radar;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket the dashboard subscribes to for live alerts
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # API endpoints the Raspberry Pi and the dashboard call
    location ~ ^/(frame|frames|activity|history|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16m;
    }
}
